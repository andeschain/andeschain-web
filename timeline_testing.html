<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pasaporte de Origen | AndesChain</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { 
                    'corp': { 500: '#10B981', 600: '#059669', 900: '#022C22' },
                    'impact': { 500: '#F59E0B' }
                },
                fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] }
            } }
        }
    </script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: rgba(15, 23, 42, 0.85); backdrop-blur: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .timeline-container { position: relative; padding-left: 1.5rem; }
        .timeline-line { position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: linear-gradient(to bottom, #10B981, #1e293b); }
        .timeline-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; overflow: hidden; }
        #timeline-map { border-radius: 1.5rem; filter: grayscale(0.2) contrast(1.1); touch-action: pan-y; }
        #location-modal { backdrop-filter: blur(12px); display: none; }
        .fade-up { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-10 antialiased overflow-x-hidden">

    <div id="location-modal" class="fixed inset-0 z-[1000] flex items-end lg:items-center justify-center p-4 bg-slate-900/95">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl max-w-sm w-full text-center space-y-6">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                <i class="fas fa-leaf"></i>
            </div>
            <div class="space-y-2">
                <h3 class="font-display font-bold text-2xl text-slate-900 leading-tight">Verificar Huella</h3>
                <p class="text-slate-500 text-sm leading-relaxed">Calcularemos la distancia y el ahorro de CO2 de este producto.</p>
            </div>
            <button onclick="requestGPS()" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold text-sm uppercase tracking-widest hover:bg-emerald-700 active:scale-95 transition-all shadow-lg shadow-emerald-100">
                ACTIVAR GPS
            </button>
            <button onclick="closeModal()" class="block w-full text-[10px] text-slate-400 font-bold uppercase tracking-widest">Omitir</button>
        </div>
    </div>

    <nav class="fixed w-full glass-header py-4 px-5 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <img src="assets/favicon.png" class="h-6">
            <span class="font-display font-bold text-[10px] uppercase tracking-[0.2em] text-white">AndesChain Ledger</span>
        </div>
        <button onclick="window.history.back()" class="bg-white/5 px-4 py-2 rounded-full text-[9px] font-bold text-slate-300 uppercase tracking-widest">
            ATRÁS
        </button>
    </nav>

    <main id="timeline-app" class="pt-24 px-5 max-w-2xl mx-auto hidden">
        <header class="mb-10 text-center">
            <div class="inline-flex items-center gap-2 bg-corp-500/10 border border-corp-500/30 px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-widest text-corp-500 mb-6 italic">
                <i class="fas fa-check-circle"></i> DATOS SINCRONIZADOS
            </div>
            <h1 id="p-name" class="font-display text-4xl lg:text-5xl font-extrabold text-white leading-[1.1] mb-4 italic">...</h1>
            <p id="p-location" class="text-slate-400 text-xs font-medium uppercase tracking-widest">...</p>
        </header>

        <section class="grid grid-cols-3 gap-2 mb-12">
            <div class="bg-slate-800/40 p-3 rounded-2xl border border-white/5 text-center">
                <p class="text-[6px] font-black text-slate-500 uppercase tracking-widest mb-1">Ciclo Vida</p>
                <span id="kpi-days" class="text-lg font-display font-bold text-corp-500">---</span>
                <p class="text-[8px] text-slate-400">Días</p>
            </div>
            <div class="bg-slate-800/40 p-3 rounded-2xl border border-white/5 text-center">
                <p class="text-[6px] font-black text-slate-500 uppercase tracking-widest mb-1">Distancia</p>
                <span id="kpi-km" class="text-lg font-display font-bold text-corp-500">0.0</span>
                <p class="text-[8px] text-slate-400">Km</p>
            </div>
            <div class="bg-impact-500/10 p-3 rounded-2xl border border-impact-500/20 text-center">
                <p class="text-[6px] font-black text-impact-500 uppercase tracking-widest mb-1">Ahorro CO2</p>
                <span id="kpi-co2" class="text-lg font-display font-bold text-impact-500">---</span>
                <p class="text-[8px] text-slate-400">vs Mercado</p>
            </div>
        </section>

        <section class="space-y-8 mb-16">
            <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em] mb-8 border-b border-white/5 pb-4 italic">Evidencia de Proceso</h3>
            <div class="timeline-container" id="timeline-list">
                <div class="timeline-line"></div>
            </div>
        </section>

        <section class="mb-10 space-y-4">
            <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">Georeferencia</h3>
            <div id="timeline-map" style="height: 250px; width: 100%;"></div>
        </section>
    </main>

    <div id="loader" class="fixed inset-0 bg-slate-900 z-[60] flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-2 border-corp-500/20 border-t-corp-500 rounded-full animate-spin mb-4"></div>
        <p class="text-[9px] font-black text-slate-500 uppercase tracking-[0.4em]">Actualizando Datos...</p>
    </div>

    <script src="js/simulador.js"></script>
    <script>
        let pLat, pLon;
        const bustCache = new Date().getTime();

        window.onload = () => {
            // FORZAR LIMPIEZA DE LOCALSTORAGE PARA ACTUALIZAR DATOS DE SIMULADOR
            localStorage.clear(); 
            setTimeout(renderTimeline, 1000);
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
        }

        function requestGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const dist = calculateDistance(pos.coords.latitude, pos.coords.longitude, pLat, pLon);
                    document.getElementById('kpi-km').innerText = dist;
                    const ahorro = Math.max(0, ((800 - dist) / 800) * 100).toFixed(0);
                    document.getElementById('kpi-co2').innerText = ahorro + "%";
                    closeModal();
                }, () => closeModal());
            }
        }

        function closeModal() { document.getElementById('location-modal').style.display = 'none'; }

        function renderTimeline() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id') || "1001";
            
            // Re-ejecutar la carga de simulador.js tras el clear
            if(typeof initAndesChain === "function") initAndesChain();
            
            const db = window.getProductos();
            const p = db.find(item => item.id == id);
            if (!p) return;

            pLat = parseFloat(p.lat); pLon = parseFloat(p.lon);
            document.getElementById('loader').style.display = 'none';
            document.getElementById('timeline-app').classList.remove('hidden');
            document.getElementById('p-name').innerText = p.nombre;
            document.getElementById('p-location').innerText = p.ubicacion;

            // Días ciclo
            const parseD = (d) => {
                const m = { "Ene": 0, "Feb": 1, "Mar": 2, "Abr": 3, "May": 4, "Jun": 5, "Jul": 6, "Ago": 7, "Sep": 8, "Oct": 9, "Nov": 10, "Dic": 11 };
                const parts = d.split(' '); return new Date(parts[2], m[parts[1]], parts[0]);
            };
            const sorted = [...p.hitos].sort((a,b) => parseD(a.fecha) - parseD(b.fecha));
            document.getElementById('kpi-days').innerText = Math.ceil(Math.abs(parseD(sorted[sorted.length-1].fecha) - parseD(sorted[0].fecha)) / 86400000);

            // Mapa
            const tMap = L.map('timeline-map', { zoomControl: false, attributionControl: false, scrollWheelZoom: false }).setView([pLat, pLon], 15);
            L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(tMap);
            L.marker([pLat, pLon], { icon: L.divIcon({ className: 'bg-corp-500 w-3 h-3 rounded-full border-2 border-white' }) }).addTo(tMap);

            // Render Hitos
            const list = document.getElementById('timeline-list');
            const absolutePath = window.location.href.split('?')[0].replace('timeline.html', '');

            [...p.hitos].reverse().forEach((h, i) => {
                const card = document.createElement('div');
                card.className = "relative pl-8 pb-10 fade-up";
                card.style.animationDelay = `${i * 0.15}s`;
                
                // Forzamos ruta absoluta + timestamp para engañar a la caché del celular
                const finalImgPath = absolutePath + h.img + "?v=" + bustCache;

                card.innerHTML = `
                    <div class="absolute left-0 top-0 w-4 h-4 rounded-full bg-corp-500 shadow-lg z-10"></div>
                    <div class="timeline-card">
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-3">
                                <h4 class="font-bold text-lg text-white leading-tight">${h.titulo}</h4>
                                <span class="text-[8px] font-black text-corp-500 bg-corp-500/10 px-2 py-1 rounded uppercase tracking-widest">${h.fecha}</span>
                            </div>
                            <p class="text-slate-400 text-xs leading-relaxed font-light italic mb-4">"${h.desc}"</p>
                        </div>
                        <div class="px-5 pb-5">
                             <img src="${finalImgPath}" class="w-full h-auto rounded-xl shadow-lg border border-white/5">
                        </div>
                    </div>`;
                list.appendChild(card);
            });

            setTimeout(() => { document.getElementById('location-modal').style.display = 'flex'; }, 1500);
        }
    </script>
</body>
</html>
