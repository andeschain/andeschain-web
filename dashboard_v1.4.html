<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AndesChain | Policy Command Center v1.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <style>
        #map { height: calc(100vh - 80px); width: 100%; border-radius: 2rem 2rem 0 0; }
        .hud-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); border: 1px solid rgba(0,0,0,0.05); }
        .tag-real { background: #10B981; color: white; padding: 2px 6px; border-radius: 4px; font-size: 8px; font-weight: 800; text-transform: uppercase; }
        .tag-demo { background: #E2E8F0; color: #64748B; padding: 2px 6px; border-radius: 4px; font-size: 8px; font-weight: 800; text-transform: uppercase; }
    </style>
</head>
<body class="bg-slate-100 font-sans overflow-hidden">

    <nav class="h-20 bg-white flex items-center justify-between px-8 border-b border-slate-200">
        <div class="flex items-center gap-3">
            <img src="assets/favicon.png" class="h-8">
            <span class="font-bold text-slate-800 tracking-tighter uppercase text-xs">Policy Command Center</span>
        </div>
        <div class="flex items-center gap-4">
            <select id="lang-selector" onchange="switchLang(this.value)" class="bg-slate-50 text-[10px] font-bold p-2 rounded-lg border-none">
                <option value="es">ESPAÑOL</option>
                <option value="en">ENGLISH</option>
            </select>
            <select id="comuna-selector" onchange="updateTerritory(this.value)" class="bg-brand-900 text-white font-bold text-xs p-2 px-4 rounded-xl outline-none">
                <option value="Paine">Paine</option>
                <option value="Limache">Limache</option>
                <option value="Valdivia">Valdivia</option>
                <option value="Itata">Valle del Itata</option>
            </select>
        </div>
    </nav>

    <div class="relative">
        <div class="absolute top-6 left-6 z-[1000] w-80 space-y-4 pointer-events-none">
            <div class="hud-card p-6 rounded-[2rem] shadow-xl pointer-events-auto">
                <h3 id="ui-producers" class="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Actores en Red</h3>
                <div id="producer-list" class="space-y-3 overflow-y-auto max-h-[400px] pr-2">
                    </div>
            </div>
            
            <div id="climate-card" class="hud-card p-6 rounded-[2rem] shadow-xl pointer-events-auto border-l-4 border-blue-500">
                <p class="text-[9px] font-black uppercase text-blue-500 mb-1">Impacto Cambio Climático</p>
                <h4 id="ui-adaptation" class="text-xs font-bold text-slate-800">Adaptación Hídrica: Alta</h4>
                <div class="w-full bg-slate-100 h-1 mt-2 rounded-full"><div class="bg-blue-500 h-full w-[65%]"></div></div>
            </div>
        </div>

        <div id="map" class="shadow-inner"></div>

        <div class="absolute bottom-10 right-10 z-[1000] hud-card p-4 rounded-2xl flex gap-6 pointer-events-auto">
            <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[#059669]"></div><span class="text-[9px] font-bold uppercase text-slate-500">Suelo Clase I-II (CIREN)</span></div>
            <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-[#4E5AF0] animate-pulse"></div><span class="text-[9px] font-bold uppercase text-slate-500">Escasez Hídrica (DGA)</span></div>
        </div>
    </div>

    <script src="js/simulador.js"></script>
    <script>
        let map, markers = [], currentLang = 'es';
        const uiText = {
            es: { producers: "Actores en Red", adaptation: "Adaptación Hídrica: Alta", passport: "Ver Pasaporte" },
            en: { producers: "Network Actors", adaptation: "Water Adaptation: High", passport: "View Passport" }
        };

        function switchLang(lang) {
            currentLang = lang;
            document.getElementById('ui-producers').innerText = uiText[lang].producers;
            document.getElementById('ui-adaptation').innerText = uiText[lang].adaptation;
            updateTerritory(document.getElementById('comuna-selector').value);
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-33.82, -70.75], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            updateTerritory('Paine');
        }

        function updateTerritory(comuna) {
            markers.forEach(m => map.removeLayer(m)); markers = [];
            const data = window.getProductos().filter(p => p.ubicacion.toLowerCase().includes(comuna.toLowerCase()));
            
            const listContainer = document.getElementById('producer-list');
            listContainer.innerHTML = data.map(p => {
                const tagClass = p.demo === "SI" ? "tag-demo" : "tag-real";
                const tagName = p.demo === "SI" ? "DEMO" : "REAL DATA";
                
                // Marcador en Mapa
                const m = L.marker([p.lat, p.lon], { 
                    icon: L.divIcon({ className: p.demo === "SI" ? 'bg-slate-400 border-2 border-white rounded-full' : 'bg-brand-500 border-2 border-white rounded-full', iconSize: [10,10]})
                }).addTo(map);
                m.bindPopup(`<div class='font-sans p-2'><span class='${tagClass}'>${tagName}</span><br><b>${p.nombre}</b><br>${p.productor}</div>`);
                markers.push(m);

                return `
                    <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 cursor-pointer transition-all border border-transparent hover:border-slate-100">
                        <img src="${p.img}" class="w-10 h-10 rounded-lg object-cover shadow-sm">
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start">
                                <p class="text-[10px] font-black truncate text-slate-800">${p.nombre}</p>
                                <span class="${tagClass}">${tagName}</span>
                            </div>
                            <p class="text-[8px] font-bold text-slate-400 uppercase">${p.productor}</p>
                            <a href="pasaporte.html?id=${p.id}" class="text-[8px] font-black text-brand-600 uppercase mt-1 block">${uiText[currentLang].passport} →</a>
                        </div>
                    </div>
                `;
            }).join('');

            if(markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.flyToBounds(group.getBounds(), { padding: [50,50] });
            }
        }
        window.onload = initMap;
    </script>
</body>
</html>
