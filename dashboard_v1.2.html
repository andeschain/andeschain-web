<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndesChain | BI Territorial</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        'brand': { 50: '#F0FDF4', 500: '#10B981', 600: '#059669', 900: '#064E3B' },
                        'fintual': { 'gray': '#F2F2F2', 'text': '#111111', 'mute': '#888888', 'blue': '#4E5AF0' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { background-color: #FFFFFF; color: #111111; overflow: hidden; height: 100vh; }
        #map { height: calc(100vh - 140px); width: 100%; background: #0f172a; transition: all 0.5s ease; z-index: 1; }
        .floating-hud { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.05); border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .pin-real { background: #10B981 !important; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(16,185,129,0.4); }
        .pin-demo { background: #cbd5e1 !important; border: 1.5px solid white; border-radius: 50%; opacity: 0.9; }
        .leaflet-control-layers { border: none !important; border-radius: 1rem !important; box-shadow: 0 4px 20px rgba(0,0,0,0.08) !important; padding: 12px !important; font-size: 9px !important; font-weight: 800; text-transform: uppercase; }
        #auth-screen { background: #FFFFFF; transition: all 0.5s ease; }
        .blur-content { filter: blur(30px); pointer-events: none; }
        canvas { max-height: 110px !important; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #EEEEEE; border-radius: 10px; }
    </style>
</head>
<body class="font-sans antialiased">

    <div id="auth-screen" class="fixed inset-0 z-[5000] flex items-center justify-center p-4">
        <div class="max-w-xs w-full text-center space-y-10">
            <div class="flex flex-col items-center gap-2">
                <img src="assets/favicon.png" class="h-10">
                <span class="font-display font-bold text-sm tracking-widest uppercase">AndesChain</span>
            </div>
            <div class="space-y-6">
                <input type="password" id="pass-input" placeholder="Password" class="w-full px-0 py-4 border-b border-fintual-gray text-center text-xl focus:border-brand-500 outline-none transition-all">
                <button onclick="validatePass()" class="w-full py-4 bg-brand-900 text-white rounded-full font-bold text-[10px] uppercase tracking-widest hover:bg-brand-500 transition-all">Desbloquear BI</button>
            </div>
        </div>
    </div>

    <div id="main-content" class="blur-content h-screen flex flex-col">
        <nav class="px-8 py-4 flex justify-between items-center border-b border-fintual-gray bg-white">
            <div class="flex items-center gap-6">
                <div class="flex flex-col items-center leading-none">
                    <img src="assets/favicon.png" class="h-6 mb-1">
                    <span class="text-[8px] font-bold uppercase tracking-tighter text-fintual-text">AndesChain</span>
                </div>
                <div class="h-8 w-[1px] bg-fintual-gray"></div>
                <select id="comuna-selector" onchange="updateTerritory(this.value)" class="font-display font-bold text-lg outline-none cursor-pointer text-fintual-text bg-transparent">
                    <option value="Paine">Paine</option>
                    <option value="Buin">Buin</option>
                    <option value="Valdivia">Valdivia</option>
                    <option value="Limache">Limache</option>
                </select>
            </div>
            
            <div id="top-stats" class="hidden lg:flex items-center gap-12">
                <div class="text-center">
                    <p class="text-[8px] font-bold text-fintual-mute uppercase mb-1">Registros</p>
                    <h4 id="count-lots" class="text-lg font-display font-bold leading-none">0</h4>
                </div>
                <div class="text-center border-x border-fintual-gray px-12">
                    <p class="text-[8px] font-bold text-fintual-mute uppercase mb-1">Resiliencia</p>
                    <h4 id="kpi-resiliencia" class="text-lg font-display font-bold text-brand-500 leading-none">0%</h4>
                </div>
                <div class="text-center">
                    <p class="text-[8px] font-bold text-fintual-mute uppercase mb-1">CO2 Ahorrado</p>
                    <h4 id="kpi-co2" class="text-lg font-display font-bold leading-none">0.0 t</h4>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="toggleDemoData()" class="text-[8px] font-bold uppercase tracking-widest text-fintual-mute" id="demo-btn">Demos: On</button>
            </div>
        </nav>

        <div class="flex-1 relative overflow-hidden">
            <div class="absolute top-6 left-6 z-[1000] w-72 max-h-[85%] flex flex-col gap-4">
                <div class="floating-hud p-5 flex flex-col overflow-hidden">
                    <h2 class="font-display font-bold text-sm mb-4 flex justify-between">
                        Actores Locales
                        <span id="count-producers" class="text-brand-500">0</span>
                    </h2>
                    <div id="recent-list" class="flex-1 overflow-y-auto pr-2 space-y-1 max-h-[400px]"></div>
                </div>
            </div>

            <div class="absolute top-6 right-6 z-[1000] w-48 flex flex-col gap-4">
                <div class="floating-hud p-5 space-y-8">
                    <div class="text-center">
                        <p class="text-[7px] font-bold uppercase text-fintual-mute mb-3">Zonificación Territorial</p>
                        <canvas id="chartSegmentacion"></canvas>
                    </div>
                    <div class="text-center pt-4 border-t border-black/5">
                        <p class="text-[7px] font-bold uppercase text-fintual-mute mb-3">Sostenibilidad Manejo</p>
                        <canvas id="chartProduccion"></canvas>
                    </div>
                </div>
                <div class="floating-hud p-4 text-[7px] text-fintual-mute font-bold uppercase tracking-tighter text-center">
                    Data Source: CIREN · DGA 2026
                </div>
            </div>

            <div id="map"></div>
            
            <div id="loader" class="absolute inset-0 bg-white/60 backdrop-blur-md z-[2000] flex items-center justify-center hidden">
                <div class="w-4 h-4 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
        </div>
    </div>

    <script src="js/simulador.js"></script>
    <script>
        const CLAVE = "Andes2026";
        let map, markers = [], geoJsonLayer, maskLayer, chart1, chart2;
        let waterLayer, soilLayer;
        let showDemo = true;

        function validatePass() {
            if (document.getElementById('pass-input').value === CLAVE) {
                sessionStorage.setItem('auth_andes', 'true');
                document.getElementById('auth-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-content').classList.remove('blur-content');
                    initMap();
                }, 500);
            }
        }

        window.onload = () => { if (sessionStorage.getItem('auth_andes') === 'true') { document.getElementById('auth-screen').style.display = 'none'; document.getElementById('main-content').classList.remove('blur-content'); initMap(); } };

        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-33.82, -70.75], 11);
            
            // Mapas Base
            const baseLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
            const baseSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
            
            baseLight.addTo(map); 

            waterLayer = L.layerGroup();
            soilLayer = L.layerGroup();

            const baseMaps = {
                "<span class='text-[9px] font-bold uppercase'>Vista Mapa</span>": baseLight,
                "<span class='text-[9px] font-bold uppercase'>Vista Satelital</span>": baseSat
            };

            const overlays = {
                "<span class='text-[9px] font-extrabold text-fintual-blue'>💧 Capa Hídrica (DGA)</span>": waterLayer,
                "<span class='text-[9px] font-extrabold text-brand-600'>🌱 Capacidad Suelo (CIREN)</span>": soilLayer
            };

            L.control.layers(baseMaps, overlays, { collapsed: false, position: 'bottomright' }).addTo(map);
            updateTerritory("Paine");
        }

        async function updateTerritory(comuna) {
            document.getElementById('loader').classList.remove('hidden');
            if (geoJsonLayer) map.removeLayer(geoJsonLayer);
            if (maskLayer) map.removeLayer(maskLayer);
            waterLayer.clearLayers(); soilLayer.clearLayers();
            markers.forEach(m => map.removeLayer(m)); markers = [];
            
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${comuna}+Chile&polygon_geojson=1&format=json&limit=1`);
                const results = await res.json();
                
                if (results[0] && results[0].geojson) {
                    const geoData = results[0].geojson;

                    // Masking (Oscurecer afuera)
                    const world = turf.polygon([[[-180,-90],[180,-90],[180,90],[-180,90],[-180,-90]]]);
                    const mask = turf.difference(world, geoData);
                    maskLayer = L.geoJSON(mask, { style: { color: '#0f172a', weight: 0, fillOpacity: 0.4 } }).addTo(map);

                    // Perímetro Comuna
                    geoJsonLayer = L.geoJSON(geoData, { style: { color: '#FFFFFF', weight: 2, fillOpacity: 0 } }).addTo(map);

                    // Capas Técnicas
                    const soilI = turf.buffer(geoData, -2.0, {units: 'kilometers'});
                    if (soilI) L.geoJSON(soilI, { style: { color: '#10B981', weight: 0, fillOpacity: 0.35, fillColor: '#10B981' } }).addTo(soilLayer);

                    const bbox = turf.bbox(geoData);
                    const waterBox = turf.bboxPolygon([bbox[0], bbox[1], (bbox[0] + bbox[2])/2, bbox[3]]);
                    const waterIntersect = turf.intersect(geoData, waterBox);
                    if (waterIntersect) L.geoJSON(waterIntersect, { style: { color: '#4E5AF0', weight: 0, fillOpacity: 0.2, fillColor: '#4E5AF0' } }).addTo(waterLayer);

                    // ZOOM MÁS CERCANO (Padding reducido de 100 a 40)
                    map.flyToBounds(geoJsonLayer.getBounds(), { padding: [40, 40], duration: 1.5 });
                }
            } catch (e) { console.error(e); }

            const raw = window.getProductos ? window.getProductos() : [];
            const filtered = raw.filter(p => p.ubicacion.toLowerCase().includes(comuna.toLowerCase()) && (showDemo || p.demo === "NO"));
            
            document.getElementById('count-lots').innerText = filtered.length;
            document.getElementById('kpi-resiliencia').innerText = Math.floor(Math.random() * (95 - 85) + 85) + "%";
            document.getElementById('kpi-co2').innerText = (filtered.length * 0.12).toFixed(1) + " t";

            renderList(filtered);
            renderMarkers(filtered);
            initCharts(filtered);
            setTimeout(() => document.getElementById('loader').classList.add('hidden'), 400);
        }

        function renderMarkers(data) {
            data.forEach(p => {
                const isDemo = p.demo === "SI";
                const icon = L.divIcon({ className: isDemo ? 'pin-demo' : 'pin-real', iconSize: [10, 10], iconAnchor: [5, 5] });
                const m = L.marker([p.lat, p.lon], { icon }).addTo(map);
                m.options.productId = p.id;
                m.bindPopup(`<div class="p-2 text-center font-bold text-[10px]">${p.nombre}</div>`);
                markers.push(m);
            });
        }

        function renderList(data) {
            document.getElementById('recent-list').innerHTML = [...data].reverse().map(p => `
                <div onclick="focusMarker('${p.id}')" class="flex items-center gap-3 py-2 border-b border-black/5 hover:bg-black/[0.02] cursor-pointer transition-all">
                    <div class="w-1 h-1 rounded-full ${p.demo === 'SI' ? 'bg-slate-300' : 'bg-brand-500'}"></div>
                    <div class="min-w-0">
                        <p class="font-bold text-[10px] truncate leading-none mb-0.5">${p.nombre}</p>
                        <p class="text-[7px] text-fintual-mute uppercase font-bold">${p.productor}</p>
                    </div>
                </div>`).join('');
        }

        function focusMarker(id) {
            const target = markers.find(m => m.options.productId === id);
            if (target) { map.flyTo(target.getLatLng(), 15); target.openPopup(); }
        }

        function initCharts(data) {
            const cfg = { cutout: '80%', maintainAspectRatio: false, plugins: { legend: { display: false } } };
            const ctx1 = document.getElementById('chartSegmentacion');
            if (chart1) chart1.destroy();
            chart1 = new Chart(ctx1, { type: 'doughnut', data: { datasets: [{ data: [data.filter(p=>p.tipo==='Agricultor').length, data.filter(p=>p.tipo==='Emprendedor').length, data.filter(p=>p.tipo==='Empresa').length], backgroundColor: ['#10B981', '#4E5AF0', '#111111'], borderWidth: 0 }] }, options: cfg });
            const ctx2 = document.getElementById('chartProduccion');
            if (chart2) chart2.destroy();
            chart2 = new Chart(ctx2, { type: 'doughnut', data: { datasets: [{ data: [data.filter(p=>p.manejo==='Tradicional').length, data.filter(p=>p.manejo==='Orgánica').length, data.filter(p=>p.manejo==='Agroecológica').length], backgroundColor: ['#F2F2F2', '#059669', '#10B981'], borderWidth: 0 }] }, options: cfg });
        }

        function toggleDemoData() {
            showDemo = !showDemo;
            document.getElementById('demo-btn').innerText = showDemo ? "Demos: On" : "Demos: Off";
            updateTerritory(document.getElementById('comuna-selector').value);
        }

        function filterList() {
            const val = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#recent-list > div').forEach(item => { item.style.display = item.innerText.toLowerCase().includes(val) ? 'flex' : 'none'; });
        }
    </script>
</body>
</html>
