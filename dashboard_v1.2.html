<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndesChain | Territorial Intelligence</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        'brand': { 50: '#f8fafc', 100: '#f1f5f9', 500: '#10B981', 600: '#059669', 900: '#0f172a' },
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { background-color: #F9FAFB; color: #1e293b; letter-spacing: -0.01em; }
        #map { height: calc(100vh - 400px); border-radius: 2rem; z-index: 10; background: #f1f5f9; border: 1px solid #e2e8f0; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (min-width: 1024px) { #map { height: calc(100vh - 300px); } }
        
        .pin-wrapper { position: relative; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
        .pin-main { width: 10px; height: 10px; border-radius: 50%; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); z-index: 2; }
        .pin-afc { background: #10B981; } .pin-emp { background: #6366F1; } .pin-cia { background: #475569; } .pin-demo { background: #cbd5e1; }
        .pin-pulse { position: absolute; width: 22px; height: 22px; border-radius: 50%; opacity: 0.15; animation: pulse 3s infinite; z-index: 1; }
        @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.4; } 100% { transform: scale(2.2); opacity: 0; } }
        
        .leaflet-popup-content-wrapper { border-radius: 1.2rem !important; padding: 0 !important; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1) !important; }
        .leaflet-popup-content { margin: 0 !important; width: 240px !important; }
        .leaflet-control-layers { border: none !important; border-radius: 1rem !important; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1) !important; padding: 12px !important; font-size: 10px !important; font-weight: 800; text-transform: uppercase; }

        #auth-screen { transition: all 0.5s ease; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .blur-content { filter: blur(25px); pointer-events: none; }
    </style>
</head>
<body class="font-sans antialiased">

    <div id="auth-screen" class="fixed inset-0 z-[5000] flex items-center justify-center p-4">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl max-w-sm w-full text-center space-y-8">
            <img src="assets/favicon.png" class="h-10 mx-auto">
            <div class="space-y-2">
                <h3 class="font-display font-bold text-2xl text-slate-900">Bienvenido</h3>
                <p class="text-slate-400 text-sm italic uppercase tracking-widest font-bold">AndesChain BI</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="pass-input" placeholder="••••••••" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 text-center text-lg outline-none focus:ring-2 ring-brand-500 transition-all">
                <button onclick="validatePass()" class="w-full py-4 bg-brand-900 text-white rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-brand-500 transition-all">Desbloquear</button>
                <p id="pass-error" class="text-red-400 text-[10px] font-bold uppercase hidden">Clave incorrecta</p>
            </div>
        </div>
    </div>

    <div id="main-content" class="blur-content transition-all duration-700">
        <nav class="bg-white/70 backdrop-blur-md border-b border-slate-100 px-6 lg:px-12 py-5 sticky top-0 z-[1000]">
            <div class="max-w-[1600px] mx-auto flex justify-between items-center">
                <div class="flex items-center gap-6">
                    <a href="index.html" class="flex items-center gap-3">
                        <img src="assets/favicon.png" class="h-7">
                        <h1 class="hidden lg:block font-display font-bold text-lg text-slate-900 uppercase">AndesChain <span class="text-brand-500">BI</span></h1>
                    </a>
                    <select id="comuna-selector" onchange="updateTerritory(this.value)" class="bg-white text-slate-600 font-bold text-[10px] px-5 py-2 rounded-full outline-none border border-slate-200 shadow-sm cursor-pointer hover:border-brand-500 transition-all">
                        <option value="Paine">Paine, RM</option>
                        <option value="Buin">Buin, RM</option>
                        <option value="Valdivia">Valdivia, CL</option>
                        <option value="Limache">Limache, V</option>
                        <option value="Isla de Maipo">Isla de Maipo, RM</option>
                    </select>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="toggleDemoData()" class="text-slate-400 text-[9px] font-bold px-4 py-2 hover:bg-slate-100 rounded-full transition-all uppercase tracking-widest">
                        <span id="demo-status-text">Ocultar Demos</span>
                    </button>
                    <button onclick="toggleUIMode()" class="bg-slate-900 text-white text-[10px] font-bold px-6 py-2.5 rounded-full hover:bg-brand-500 shadow-lg transition-all uppercase tracking-widest">Dashboard Full</button>
                </div>
            </div>
        </nav>

        <main class="max-w-[1600px] mx-auto p-6 lg:p-10 space-y-10">
            <div id="stats-panel" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 transition-all">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 text-center lg:text-left">Puntos de Origen</p>
                    <div class="flex items-baseline justify-center lg:justify-start gap-2">
                        <h3 id="count-lots" class="text-4xl font-display font-bold text-slate-900">0</h3>
                        <span class="text-brand-500 text-xs font-bold"><i class="fas fa-arrow-up"></i> 12%</span>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 text-center lg:text-left">Productores Locales</p>
                    <h3 id="count-producers" class="text-4xl font-display font-bold text-slate-900 text-center lg:text-left">0</h3>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 text-center lg:text-left">Ahorro CO2 Estimado</p>
                    <div class="flex items-baseline justify-center lg:justify-start gap-1 text-indigo-600">
                        <h3 id="kpi-co2" class="text-4xl font-display font-bold">14.2</h3>
                        <span class="text-xs font-bold uppercase tracking-widest">Ton</span>
                    </div>
                </div>
                <div class="bg-brand-50 p-6 rounded-3xl border border-brand-100">
                    <p class="text-[10px] font-bold text-brand-600 uppercase tracking-widest mb-2 text-center lg:text-left">Resiliencia Hídrica</p>
                    <div class="flex items-baseline justify-center lg:justify-start gap-1">
                        <h3 id="kpi-resiliencia" class="text-4xl font-display font-bold text-brand-600">88</h3>
                        <span class="text-brand-600 text-xs font-bold">%</span>
                    </div>
                </div>
            </div>

            <div id="charts-row" class="hidden lg:grid grid-cols-2 gap-8">
                <div class="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm flex flex-col items-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-6 tracking-widest">Segmentación Socioproductiva</p>
                    <div class="h-32 w-full"><canvas id="chartSegmentacion"></canvas></div>
                </div>
                <div class="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm flex flex-col items-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-6 tracking-widest">Sostenibilidad de Suelos</p>
                    <div class="h-32 w-full"><canvas id="chartProduccion"></canvas></div>
                </div>
            </div>

            <div class="grid grid-cols-12 gap-8 lg:gap-10">
                <div id="list-panel" class="col-span-12 lg:col-span-4 flex flex-col gap-6">
                    <div class="relative">
                        <input type="text" id="search-input" onkeyup="filterList()" placeholder="Buscar en el territorio..." class="w-full bg-white border border-slate-200 rounded-2xl py-4 pl-12 pr-4 text-sm font-medium outline-none focus:ring-2 ring-brand-500/10 shadow-sm transition-all">
                        <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    </div>
                    <div id="recent-list" class="grid grid-cols-1 gap-3 overflow-y-auto max-h-[600px] pr-2"></div>
                </div>

                <div id="map-panel" class="col-span-12 lg:col-span-8 relative">
                    <div id="map"></div>
                    <div id="loader" class="absolute inset-0 bg-white/60 backdrop-blur-md z-[1001] flex items-center justify-center rounded-3xl hidden">
                        <div class="w-8 h-8 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <div class="absolute bottom-6 left-6 z-[1001] bg-white/90 backdrop-blur px-4 py-2 rounded-xl border border-slate-200 shadow-sm pointer-events-none text-left">
                        <p class="text-[8px] font-bold text-slate-400 uppercase leading-none mb-1 text-brand-600">Territorial Intelligence Engine</p>
                        <p class="text-[9px] font-bold text-slate-600 uppercase">CIREN · DGA · IDE Chile API Preview</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/simulador.js"></script>
    <script>
        const CLAVE = "Andes2026";
        let map, markers = [], geoJsonLayer, chart1, chart2, layerControl;
        let waterLayer, soilLayer;
        let showDemo = true;

        function validatePass() {
            if (document.getElementById('pass-input').value === CLAVE) {
                sessionStorage.setItem('auth_andes', 'true');
                document.getElementById('auth-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-content').classList.remove('blur-content');
                    initMap();
                }, 500);
            } else {
                document.getElementById('pass-error').classList.remove('hidden');
            }
        }

        window.onload = () => { if (sessionStorage.getItem('auth_andes') === 'true') { document.getElementById('auth-screen').style.display = 'none'; document.getElementById('main-content').classList.remove('blur-content'); initMap(); } };

        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-33.82, -70.75], 11);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map); 
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            
            waterLayer = L.layerGroup();
            soilLayer = L.layerGroup();

            const overlays = {
                "<span class='text-indigo-600 font-bold'>💧 Escasez Hídrica</span>": waterLayer,
                "<span class='text-emerald-600 font-bold'>🌱 Calidad de Suelo</span>": soilLayer
            };

            layerControl = L.control.layers(null, overlays, { collapsed: false, position: 'topright' }).addTo(map);
            updateTerritory("Paine");
        }

        async function updateTerritory(comuna) {
            document.getElementById('loader').classList.remove('hidden');
            if (geoJsonLayer) map.removeLayer(geoJsonLayer);
            waterLayer.clearLayers(); soilLayer.clearLayers();
            markers.forEach(m => map.removeLayer(m)); markers = [];
            
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${comuna}+Chile&polygon_geojson=1&format=json&limit=1`);
                const results = await res.json();
                
                if (results[0] && results[0].geojson) {
                    const geoData = results[0].geojson;
                    const center = [parseFloat(results[0].lon), parseFloat(results[0].lat)];
                    const bbox = turf.bbox(geoData);
                    
                    geoJsonLayer = L.geoJSON(geoData, { 
                        style: { color: '#cbd5e1', weight: 2, fillOpacity: 0.05, fillColor: '#94a3b8' } 
                    }).addTo(map);

                    // --- GENERACIÓN DE CAPAS TÉCNICAS (SIMULACIÓN MORFOLOGÍA REAL) ---

                    // 1. Suelo Clase I: Eje Aluvial Irregular (Franja de Valle)
                    const lineValle = turf.lineString([[bbox[0], (bbox[1]+bbox[3])/2], [bbox[2], (bbox[1]+bbox[3])/2 + 0.02]]);
                    const valleyCore = turf.buffer(lineValle, 2.8, {units: 'kilometers'});
                    const soilI = turf.intersect(geoData, valleyCore);
                    if (soilI) {
                        L.geoJSON(soilI, {
                            style: { color: '#10B981', weight: 0, fillOpacity: 0.35, fillColor: '#10B981' }
                        }).addTo(soilLayer).bindTooltip("Suelo Clase I: Alta Productividad (Núcleo Aluvial)");
                    }

                    // 2. Suelo Clase III: Transición Piedemonte
                    const transitionZone = turf.buffer(lineValle, 5, {units: 'kilometers'});
                    const soilIII_Intersect = turf.intersect(geoData, transitionZone);
                    if (soilIII_Intersect && soilI) {
                        const soilIII = turf.difference(soilIII_Intersect, soilI);
                        L.geoJSON(soilIII, {
                            style: { color: '#A3E635', weight: 0, fillOpacity: 0.2, fillColor: '#A3E635' }
                        }).addTo(soilLayer).bindTooltip("Suelo Clase III: Limitaciones Moderadas");
                    }

                    // 3. Capa Hídrica: Cuenca Baja / Zona Poniente (Modelo DGA)
                    const waterBox = turf.bboxPolygon([bbox[0], bbox[1], (bbox[0] + bbox[2])/2 + 0.05, bbox[3]]);
                    const waterIntersect = turf.intersect(geoData, waterBox);
                    if (waterIntersect) {
                        L.geoJSON(waterIntersect, {
                            style: { color: '#4E5AF0', weight: 0, fillOpacity: 0.2, fillColor: '#6366F1' }
                        }).addTo(waterLayer).bindTooltip("Zona Bajo Decreto de Escasez Hídrica DGA");
                    }

                    map.flyToBounds(geoJsonLayer.getBounds(), { padding: [50, 50], duration: 1.5 });
                }
            } catch (e) { console.error(e); }

            const raw = window.getProductos ? window.getProductos() : [];
            const filtered = raw.filter(p => p.ubicacion.toLowerCase().includes(comuna.toLowerCase()) && (showDemo || p.demo === "NO"));
            
            document.getElementById('count-lots').innerText = filtered.length;
            document.getElementById('count-producers').innerText = [...new Set(filtered.map(p => p.productor))].length;
            document.getElementById('kpi-resiliencia').innerText = Math.floor(Math.random() * (98 - 82) + 82);
            document.getElementById('kpi-co2').innerText = (filtered.length * 0.12).toFixed(1);

            initCharts(filtered);
            renderList(filtered);
            renderMarkers(filtered);
            setTimeout(() => document.getElementById('loader').classList.add('hidden'), 600);
        }

        function renderMarkers(data) {
            data.forEach(p => {
                const type = p.tipo === 'Emprendedor' ? 'emp' : (p.tipo === 'Empresa' ? 'cia' : 'afc');
                const icon = L.divIcon({
                    className: 'c-icon',
                    html: `<div class="pin-wrapper"><div class="pin-main pin-${type}"></div></div>`,
                    iconSize: [26, 26], iconAnchor: [13, 13]
                });
                const m = L.marker([p.lat, p.lon], { icon }).addTo(map);
                m.options.productId = p.id;
                m.bindPopup(`<div class="p-4 space-y-3"><p class="font-bold text-slate-900 text-sm leading-tight">${p.nombre}</p><a href="timeline.html?id=${p.id}" class="block bg-slate-900 text-white text-center text-[10px] font-bold py-2.5 rounded-lg uppercase tracking-widest hover:bg-brand-500">Expediente</a></div>`);
                markers.push(m);
            });
        }

        function renderList(data) {
            document.getElementById('recent-list').innerHTML = [...data].reverse().map(p => `
                <div onclick="focusMarker('${p.id}')" class="group flex items-center gap-4 p-4 rounded-2xl bg-white border border-slate-100 hover:border-brand-500 cursor-pointer shadow-sm transition-all hover:shadow-md">
                    <img src="${p.img}?v=1" class="w-10 h-10 rounded-xl object-cover bg-slate-50">
                    <div class="min-w-0">
                        <p class="font-bold text-[11px] text-slate-900 truncate">${p.nombre}</p>
                        <p class="text-[9px] text-slate-400 uppercase font-bold tracking-tighter">${p.productor}</p>
                    </div>
                </div>`).join('');
        }

        function focusMarker(id) {
            const target = markers.find(m => m.options.productId === id);
            if (target) { map.flyTo(target.getLatLng(), 15); target.openPopup(); }
        }

        function initCharts(data) {
            const ctx1 = document.getElementById('chartSegmentacion');
            const ctx2 = document.getElementById('chartProduccion');
            if (chart1) chart1.destroy(); if (chart2) chart2.destroy();
            const config = { cutout: '86%', maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 6, usePointStyle: true, padding: 15, font: { size: 9, family: 'Plus Jakarta Sans', weight: 'bold' } } } } };
            chart1 = new Chart(ctx1, { type: 'doughnut', data: { labels: ['AFC', 'Emprend.', 'Empresa'], datasets: [{ data: [data.filter(p=>p.tipo==='Agricultor').length, data.filter(p=>p.tipo==='Emprendedor').length, data.filter(p=>p.tipo==='Empresa').length], backgroundColor: ['#10B981', '#6366F1', '#475569'], borderWidth: 0 }] }, options: config });
            chart2 = new Chart(ctx2, { type: 'doughnut', data: { labels: ['Trad.', 'Org.', 'Agro.'], datasets: [{ data: [data.filter(p=>p.manejo==='Tradicional').length, data.filter(p=>p.manejo==='Orgánica').length, data.filter(p=>p.manejo==='Agroecológica').length], backgroundColor: ['#e2e8f0', '#059669', '#10B981'], borderWidth: 0 }] }, options: config });
        }

        function toggleUIMode() {
            document.getElementById('stats-panel').classList.toggle('hidden');
            document.getElementById('charts-row').classList.toggle('hidden');
            document.getElementById('list-panel').classList.toggle('lg:col-span-4');
            document.getElementById('list-panel').classList.toggle('hidden');
            document.getElementById('map-panel').classList.toggle('lg:col-span-8');
            document.getElementById('map-panel').classList.toggle('lg:col-span-12');
            setTimeout(() => map.invalidateSize(), 400);
        }

        function filterList() {
            const val = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#recent-list > div').forEach(item => { item.style.display = item.innerText.toLowerCase().includes(val) ? 'flex' : 'none'; });
        }

        function toggleDemoData() {
            showDemo = !showDemo;
            document.getElementById('demo-status-text').innerText = showDemo ? "Ocultar Demos" : "Mostrar Demos";
            updateTerritory(document.getElementById('comuna-selector').value);
        }
    </script>
</body>
</html>
