<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndesChain | Territorial Intelligence</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        'brand': { 50: '#f8fafc', 100: '#f1f5f9', 500: '#10B981', 600: '#059669', 900: '#0f172a' },
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { background-color: #F9FAFB; color: #1e293b; letter-spacing: -0.01em; }
        #map { height: calc(100vh - 400px); border-radius: 2rem; z-index: 10; background: #f1f5f9; border: 1px solid #e2e8f0; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (min-width: 1024px) { #map { height: calc(100vh - 300px); } }
        
        .pin-wrapper { position: relative; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
        .pin-main { width: 10px; height: 10px; border-radius: 50%; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); z-index: 2; }
        .pin-afc { background: #10B981; } .pin-emp { background: #6366F1; } .pin-cia { background: #475569; } .pin-demo { background: #cbd5e1; }
        .pin-pulse { position: absolute; width: 22px; height: 22px; border-radius: 50%; opacity: 0.15; animation: pulse 3s infinite; z-index: 1; }
        @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.4; } 100% { transform: scale(2.2); opacity: 0; } }
        
        .leaflet-popup-content-wrapper { border-radius: 1.2rem !important; padding: 0 !important; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1) !important; }
        .leaflet-popup-content { margin: 0 !important; width: 240px !important; }
        .leaflet-control-layers { border: none !important; border-radius: 1rem !important; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1) !important; padding: 12px !important; font-size: 10px !important; font-weight: 800; text-transform: uppercase; }

        #auth-screen { transition: all 0.5s ease; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .blur-content { filter: blur(25px); pointer-events: none; }
    </style>
</head>
<body class="font-sans antialiased">

    <div id="auth-screen" class="fixed inset-0 z-[5000] flex items-center justify-center p-4">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl max-w-sm w-full text-center space-y-8">
            <img src="assets/favicon.png" class="h-10 mx-auto">
            <div class="space-y-2">
                <h3 class="font-display font-bold text-2xl text-slate-900">Bienvenido</h3>
                <p class="text-slate-400 text-sm italic uppercase tracking-widest font-bold">AndesChain BI</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="pass-input" placeholder="••••••••" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 text-center text-lg outline-none focus:ring-2 ring-brand-500 transition-all">
                <button onclick="validatePass()" class="w-full py-4 bg-brand-900 text-white rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-brand-500 transition-all">Desbloquear</button>
                <p id="pass-error" class="text-red-400 text-[10px] font-bold uppercase hidden">Clave incorrecta</p>
            </div>
        </div>
    </div>

    <div id="main-content" class="blur-content transition-all duration-700">
        <nav class="bg-white/70 backdrop-blur-md border-b border-slate-100 px-6 lg:px-12 py-5 sticky top-0 z-[1000]">
            <div class="max-w-[1600px] mx-auto flex justify-between items-center">
                <div class="flex items-center gap-6">
                    <a href="index.html" class="flex items-center gap-3">
                        <img src="assets/favicon.png" class="h-7">
                        <h1 class="hidden lg:block font-display font-bold text-lg text-slate-900 uppercase">AndesChain <span class="text-brand-500">BI</span></h1>
                    </a>
                    <select id="comuna-selector" onchange="updateTerritory(this.value)" class="bg-white text-slate-600 font-bold text-[10px] px-5 py-2 rounded-full outline-none border border-slate-200 shadow-sm cursor-pointer hover:border-brand-500 transition-all">
                        <option value="Paine">Paine, RM</option>
                        <option value="Buin">Buin, RM</option>
                        <option value="Valdivia">Valdivia, CL</option>
                        <option value="Limache">Limache, V</option>
                        <option value="Isla de Maipo">Isla de Maipo, RM</option>
                    </select>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="toggleDemoData()" class="text-slate-400 text-[9px] font-bold px-4 py-2 hover:bg-slate-100 rounded-full transition-all uppercase tracking-widest">
                        <span id="demo-status-text">Ocultar Demos</span>
                    </button>
                    <button onclick="toggleUIMode()" class="bg-slate-900 text-white text-[10px] font-bold px-6 py-2.5 rounded-full hover:bg-brand-500 shadow-lg transition-all uppercase tracking-widest">Dashboard Full</button>
                </div>
            </div>
        </nav>

        <main class="max-w-[1600px] mx-auto p-6 lg:p-10 space-y-10">
            <div id="stats-panel" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 transition-all">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 text-center lg:text-left">Puntos de Origen</p>
                    <div class="flex items-baseline justify-center lg:justify-start gap-2">
                        <h3 id="count-lots" class="text-4xl font-display font-bold text-slate-900">0</h3>
                        <span class="text-brand-500 text-xs font-bold"><i class="fas fa-arrow-up"></i> 12%</span>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 text-center lg:text-left">Productores Locales</p>
                    <h3 id="count-producers" class="text-4xl font-display font-bold text-slate-900 text-center lg:text-left">0</h3>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 text-center lg:text-left">Ahorro CO2 Estimado</p>
                    <div class="flex items-baseline justify-center lg:justify-start gap-1 text-indigo-600">
                        <h3 id="kpi-co2" class="text-4xl font-display font-bold">14.2</h3>
                        <span class="text-xs font-bold uppercase tracking-widest">Ton</span>
                    </div>
                </div>
                <div class="bg-brand-50 p-6 rounded-3xl border border-brand-100">
                    <p class="text-[10px] font-bold text-brand-600 uppercase tracking-widest mb-2 text-center lg:text-left">Resiliencia Hídrica</p>
                    <div class="flex items-baseline justify-center lg:justify-start gap-1">
                        <h3 id="kpi-resiliencia" class="text-4xl font-display font-bold text-brand-600">88</h3>
                        <span class="text-brand-600 text-xs font-bold">%</span>
                    </div>
                </div>
            </div>

            <div id="charts-row" class="hidden lg:grid grid-cols-2 gap-8">
                <div class="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm flex flex-col items-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-6 tracking-widest">Segmentación Socioproductiva</p>
                    <div class="h-32 w-full"><canvas id="chartSegmentacion"></canvas></div>
                </div>
                <div class="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm flex flex-col items-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-6 tracking-widest">Sostenibilidad de Suelos</p>
                    <div class="h-32 w-full"><canvas id="chartProduccion"></canvas></div>
                </div>
            </div>

            <div class="grid grid-cols-12 gap-8 lg:gap-10">
                <div id="list-panel" class="col-span-12 lg:col-span-4 flex flex-col gap-6">
                    <div class="relative">
                        <input type="text" id="search-input" onkeyup="filterList()" placeholder="Buscar en el territorio..." class="w-full bg-white border border-slate-200 rounded-2xl py-4 pl-12 pr-4 text-sm font-medium outline-none focus:ring-2 ring-brand-500/10 shadow-sm transition-all">
                        <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    </div>
                    <div id="recent-list" class="grid grid-cols-1 gap-3 overflow-y-auto max-h-[600px] pr-2"></div>
                </div>

                <div id="map-panel" class="col-span-12 lg:col-span-8 relative">
                    <div id="map"></div>
                    <div id="loader" class="absolute inset-0 bg-white/60 backdrop-blur-md z-[1001] flex items-center justify-center rounded-3xl hidden">
                        <div class="w-8 h-8 border-2 border-brand-500 border-t-transparent
