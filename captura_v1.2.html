<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Captura de Origen v1.2 | AndesChain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .btn-field { height: 70px; font-size: 1.1rem; }
        .input-field { background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 1rem; padding: 1rem; }
        .input-field:focus { border-color: #10B981; outline: none; background: white; }
    </style>
</head>
<body class="bg-slate-50 pb-12">
    <nav class="bg-white/90 backdrop-blur-md border-b p-4 sticky top-0 z-50 flex justify-between items-center">
        <img src="assets/favicon.png" class="h-8">
        <span class="text-[10px] font-black text-emerald-600 uppercase tracking-widest">Modo Productor</span>
    </nav>

    <main class="max-w-md mx-auto p-6">
        <div class="mb-8">
            <h1 class="text-3xl font-black text-slate-900 leading-tight">Nueva Ficha de Origen</h1>
            <p class="text-slate-500 font-medium">Registra el hito de hoy para certificar tu cosecha.</p>
        </div>

        <form class="space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-2">Evidencia Fotográfica (EXIF)</label>
                <div class="aspect-square bg-white border-4 border-dashed border-slate-200 rounded-[2.5rem] flex flex-col items-center justify-center text-center p-8 group active:border-emerald-500 transition-all">
                    <i class="fas fa-camera text-5xl text-emerald-500 mb-4"></i>
                    <p class="text-sm font-bold text-slate-400">TOCA PARA CAPTURAR</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 space-y-4">
                <select class="input-field w-full font-bold text-slate-700">
                    <option>Siembra</option>
                    <option>Poda</option>
                    <option>Floración</option>
                    <option selected>Cosecha</option>
                </select>
                <input type="text" placeholder="Nombre del Cultivo" class="input-field w-full font-bold">
                <textarea placeholder="Breve descripción del proceso..." class="input-field w-full h-24 text-sm"></textarea>
            </div>

            <div class="bg-emerald-900 p-6 rounded-[2rem] flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">GPS Audit v1.2</p>
                    <p class="text-white font-mono text-xs">Lat: -33.824 | Lon: -70.751</p>
                </div>
                <i class="fas fa-satellite-dish text-emerald-400 text-2xl animate-pulse"></i>
            </div>

            <button type="button" class="btn-field w-full bg-emerald-600 text-white rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-emerald-200">
                Firmar y Certificar
            </button>
        </form>
    </main>
</body>
</html>
